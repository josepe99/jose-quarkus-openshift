apiVersion: v1
kind: Service
metadata:
  name: service-transactions
spec:
  type: NodePort
  selector:
    app: transactions
  ports:
    - port: 8080
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transactions
  template:
    metadata:
      labels:
        app: transactions
    spec:
      initContainers:
        - name: build-common-modules
          image: jcardozo/service-transactions-dev:dev
          imagePullPolicy: Never
          workingDir: /workspace
          command: ["bash", "-lc"]
          args: ["mvn -pl common-modules -am install -DskipTests -f /workspace/pom.xml"]
          volumeMounts:
            - name: transactions-src
              mountPath: /workspace
            - name: m2-cache
              mountPath: /root/.m2
      containers:
        - name: transactions
          image: jcardozo/service-transactions-dev:dev
          imagePullPolicy: Never
          workingDir: /workspace/service-transactions
          command: ["mvn"]
          args: ["quarkus:dev", "-Dquarkus.http.host=0.0.0.0"]
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: transactions-src
              mountPath: /workspace
            - name: m2-cache
              mountPath: /root/.m2
      volumes:
        - name: transactions-src
          hostPath:
            path: /mnt/host
            type: Directory
        - name: m2-cache
          emptyDir: {}
---
