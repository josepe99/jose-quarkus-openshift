apiVersion: v1
kind: Service
metadata:
  name: service-transactions
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: transactions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transactions
  template:
    metadata:
      labels:
        app: transactions
    spec:
      containers:
        - name: transactions
          image: service-transactions:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: postgres-secret
---
apiVersion: v1
kind: Service
metadata:
  name: service-analytics
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: analytics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: service-analytics:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: postgres-secret
