apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - postgres-db.yaml

patches:
  - path: services-nodeport.yaml
  - path: transactions-dev.yaml
  - path: analytics-dev.yaml

secretGenerator:
  - name: postgres-secret
    envs:
      - .env

generatorOptions:
  disableNameSuffixHash: true
