apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-dep
spec:
  template:
    spec:
      initContainers:
        - name: build-common-modules
          image: jcardozo/service-analytics-dev:dev
          imagePullPolicy: Never
          workingDir: /workspace
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              find_root() {
                if [ -f /workspace/pom.xml ] && [ -d /workspace/common-modules ]; then
                  printf '%s\n' /workspace
                  return 0
                fi
                for dir in /workspace/*; do
                  [ -d "$dir" ] || continue
                  if [ -f "$dir/pom.xml" ] && [ -d "$dir/common-modules" ]; then
                    printf '%s\n' "$dir"
                    return 0
                  fi
                done
                echo "Unable to find repo root under /workspace. Expected pom.xml and common-modules/." >&2
                ls -la /workspace >&2 || true
                return 1
              }
              ROOT_DIR="$(find_root)"
              cd "$ROOT_DIR"
              mvn -pl common-modules -am install -DskipTests -f "$ROOT_DIR/pom.xml"
          volumeMounts:
            - name: analytics-src
              mountPath: /workspace
            - name: m2-cache
              mountPath: /root/.m2
      containers:
        - name: analytics
          image: jcardozo/service-analytics-dev:dev
          imagePullPolicy: Never
          workingDir: /workspace
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              find_root() {
                if [ -f /workspace/pom.xml ] && [ -d /workspace/service-analytics ]; then
                  printf '%s\n' /workspace
                  return 0
                fi
                for dir in /workspace/*; do
                  [ -d "$dir" ] || continue
                  if [ -f "$dir/pom.xml" ] && [ -d "$dir/service-analytics" ]; then
                    printf '%s\n' "$dir"
                    return 0
                  fi
                done
                echo "Unable to find analytics source under /workspace." >&2
                ls -la /workspace >&2 || true
                return 1
              }
              ROOT_DIR="$(find_root)"
              cd "$ROOT_DIR/service-analytics"
              exec mvn quarkus:dev -Dquarkus.http.host=0.0.0.0
          env:
            - name: QUARKUS_ANALYTICS_DISABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: analytics-src
              mountPath: /workspace
            - name: m2-cache
              mountPath: /root/.m2
      volumes:
        - name: analytics-src
          hostPath:
            path: /mnt/host
            type: Directory
        - name: m2-cache
          emptyDir: {}
